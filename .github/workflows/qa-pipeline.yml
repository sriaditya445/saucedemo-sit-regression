
name: SauceDemo QA Automation Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  sit-testing:
    name: SIT Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Execute SIT tests
        run: npm run test:sit

      - name: Upload SIT HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sit-playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload SIT Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sit-test-results
          path: test-results/
          retention-days: 30

  regression-testing:
    name: Regression Testing
    needs: sit-testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Execute Regression tests
        run: npm run test:regression

      - name: Upload Regression HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Regression Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-test-results
          path: test-results/
          retention-days: 30
